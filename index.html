<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yalla Expat — Legal</title>
  <meta name="robots" content="noindex">
  <style>
:root {
  --bg: #f7f5f2;
  --text: #1c1917;
  --text-soft: #78716c;
  --accent-dark: #0f766e;
  --font-display: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
}
a { color: var(--accent-dark); }
.site-nav {
  max-width: 40rem;
  margin: 0 auto;
  padding: 16px 22px 0;
  font-size: 14px;
}
.site-nav a { margin-right: 14px; text-decoration: none; }
.site-nav a:hover { text-decoration: underline; }
.legal-page {
  max-width: 40rem;
  margin: 0 auto;
  padding: 28px 22px 48px;
  font-size: 15px;
  line-height: 1.55;
}
.legal-page h1 {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 600;
  margin: 8px 0 12px;
}
.legal-page h2 {
  font-size: 16px;
  font-weight: 600;
  margin: 22px 0 8px;
}
.legal-page p, .legal-page li { margin-bottom: 10px; }
.legal-page ul { padding-left: 18px; margin-bottom: 12px; }
.legal-draft, .legal-updated { font-size: 13px; color: var(--text-soft); }
.legal-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
.home {
  max-width: 40rem;
  margin: 0 auto;
  padding: 48px 22px;
}
.home h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
.home p { color: var(--text-soft); line-height: 1.5; }
.home ul { margin-top: 24px; padding-left: 0; list-style: none; }
.home li { margin-bottom: 12px; }
.home a { font-size: 18px; }
</style>
</head>
<body>
  <nav class="site-nav" aria-label="Legal">
    <a href="./">Yalla Expat legal</a>
    <a href="privacy.html">Privacy</a>
    <a href="terms.html">Terms</a>
  </nav>

  <main class="home">
    <h1>Yalla Expat</h1>
    <p>Public privacy policy and terms for App Store Connect. Same draft text as the in-app pages. App Studio owns the final legal copy before App Store review.</p>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li><a href="terms.html">Terms of Use</a></li>
    </ul>
    <p>Bundle id <span class="legal-mono">com.zagge.speakarabic</span></p>
  </main>
</body>
</html>
